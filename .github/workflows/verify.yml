name: Verify foundation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: cd android-app && ./gradlew :app:testDevDebugUnitTest :app:assembleDevDebug
  firebase-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix backend/functions install --no-audit --no-fund
      - run: npm --prefix backend/functions run check
      - run: npm --prefix tests/firebase install --no-audit --no-fund
      - run: npm install -g firebase-tools@14.25.0
      - run: ./scripts/test-firebase.sh
  source-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/verify-repository.py
      - run: python3 scripts/validate_firebase_config.py
      - run: python3 -m unittest discover -s tests/repository -p "test_*.py"
      - run: sh -n android-app/gradlew
